name: CI

# Placeholder CI workflow, per Section 5.1 of the Vision/Roadmap/Release Plan.
# Real test steps are added once the pytest and frontend test suites exist
# (see Section 6.4, Collaboration and Quality Tools).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Placeholder test step
        run: echo "No backend tests yet - pytest suite added in an upcoming sprint."

  frontend-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Placeholder test step
        run: echo "No frontend tests yet - Vitest suite added in an upcoming sprint."
