name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # A throwaway Postgres with the pgvector extension, just for this run.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: knowledgevault
          POSTGRES_PASSWORD: knowledgevault
          POSTGRES_DB: knowledgevault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledgevault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://knowledgevault:knowledgevault@localhost:5432/knowledgevault

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          # The CPU-only build of PyTorch is much smaller than the default one.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # The embedding model is about 90 MB; cache it so it is only downloaded
      # when the model name below changes.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-all-MiniLM-L6-v2

      - name: Run tests
        run: pytest

  # KV-35: build the image and start the same stack a developer starts with
  # `docker compose up`, then check it end to end. The backend job above uses
  # the same pgvector/pgvector:pg16 image for its database.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # health, upload, search, delete: the same script used to check the AWS server
      - name: Smoke test the running stack
        run: |
          pip install httpx==0.27.2
          python deploy/smoke_test.py http://localhost:8000

      # KV-41: make sure the server setup files stay valid
      - name: Check the server (AWS) setup files
        run: |
          POSTGRES_PASSWORD=ci API_HOST=localhost CORS_ORIGINS=http://localhost:5173 \
            docker compose -f docker-compose.prod.yml config --quiet
          docker run --rm -e API_HOST=localhost \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  frontend-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Placeholder test step
        run: echo "No frontend tests yet - Vitest suite added in an upcoming sprint."
